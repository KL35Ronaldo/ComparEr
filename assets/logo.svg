<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#833ab4"/>
      <stop offset="35%" stop-color="#fd1d1d"/>
      <stop offset="100%" stop-color="#fcb045"/>
    </linearGradient>
  </defs>
  <!-- Icon: two overlapping circles representing mutual follows -->
  <circle cx="20" cy="24" r="13" fill="url(#lg1)" opacity="0.9"/>
  <circle cx="34" cy="24" r="13" fill="url(#lg1)" opacity="0.7"/>
  <circle cx="20" cy="24" r="13" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <circle cx="34" cy="24" r="13" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Wordmark -->
  <text x="56" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="url(#lg1)" letter-spacing="-0.5">followback</text>
